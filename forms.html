<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>

<div class="container">
    <div class="row">
        <div class="col-sm-4 mx-auto border">
            <form action="">
                <div class="mb-2">
                    <label for="Name" class="form-label text-success">Full Name</label>
                    <input type="text" class="form-control rounded-1" id="Name">


                </div>

                <div class="mb-2">
                    <label for="Email" class="form-label text-success">Email</label>
                    <input type="email" class="form-control rounded-1" id="Email">


                </div>

                <div class="mb-2">
                    <label for="Password" class="form-label text-success">Password</label>
                    <input type="password" class="form-control rounded-1" id="Password">


                </div>

                <div class="mb-2">
                    <label for="Date of Birth" class="form-label text-success">Date of Birth</label>
                    <input type="Date" class="form-control rounded-1" id="Date of Birth">


                </div>

                <div class="mb-2">

                    <label for="edu" class="form-label text-success">Eduction</label>
                    <select id="edu" class="form-select">
                        <option value="">University</option>
                        <option value="">College</option>
                        <option value="">Polytechnic</option>
                        <option value="">High School</option>
                    </select>
                </div>

                <p class="text-success mb-0">Select your Gender</p>
                <div class="form-check">
                    <input type="radio" class="form-check-input" id="radio1" name="gender" value="option1" checked>Female
                    <label class="form-check-label" for="radio1"></label>
                </div>
                <div class="form-check">
                    <input type="radio" class="form-check-input" id="radio2" name="gender" value="option2">Male
                    <label class="form-check-label" for="radio2"></label>
                </div>

                <p class="text-success mt-2 mb-0">Select your Favourite Sport</p>

                <div class="form-check">
  <input class="form-check-input" type="checkbox" id="check1" name="option1" value="something">
  <label class="form-check-label">Badminton</label>
</div>
                <div class="form-check">
  <input class="form-check-input" type="checkbox" id="check1" name="option1" value="something">
  <label class="form-check-label">Soccer</label>
</div>
                <div class="form-check">
  <input class="form-check-input" type="checkbox" id="check1" name="option1" value="something">
  <label class="form-check-label">Volleyball</label>
</div>
                <div class="form-check">
  <input class="form-check-input" type="checkbox" id="check1" name="option1" value="something">
  <label class="form-check-label">Handball</label>
</div>
                <div class="form-check">
  <input class="form-check-input" type="checkbox" id="check1" name="option1" value="something">
  <label class="form-check-label">Basketball</label>
</div>
                <div class="form-check">
  <input class="form-check-input" type="checkbox" id="check1" name="option1" value="something">
  <label class="form-check-label">Tennis</label>
</div>
                <div class="form-check">
  <input class="form-check-input" type="checkbox" id="check1" name="option1" value="something">
  <label class="form-check-label">Netball</label>
</div>
                <button class="btn-danger w-100 rounded-0 my-2">Submit</button>

            </form>
        </div>
    </div>
</div>

</body>
</html>
